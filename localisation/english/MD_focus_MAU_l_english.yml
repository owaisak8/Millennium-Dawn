l_english:
 MAU_a_nation_at_the_crossroads: "A Nation at the Crossroads"
 MAU_a_nation_at_the_crossroads_desc: "At the start of the new millennium, Mauritania is balancing an entrenched presidency, a young multiparty system and a fragile development base. Our choices will shape the state's institutions and its place in the Sahel."
 MAU_preserve_prds_government: "Preserve the PRDS Government"
 MAU_preserve_prds_government_desc: "The Democratic and Social Republican Party dominates the political system under President Maaouya Ould Sid'Ahmed Taya. We can consolidate the ruling apparatus, but a closed political order carries long-term risks."
 MAU_rebuild_the_ruling_party: "Rebuild the Ruling Party"
 MAU_rebuild_the_ruling_party_desc: "Patronage and personal networks sustain the governing party. Better administration can strengthen the state, but patronage reform must be balanced against the interests that keep the coalition together."
 MAU_manage_the_2003_coup_attempt: "Manage the 2003 Coup Attempt"
 MAU_manage_the_2003_coup_attempt_desc: "The June 2003 coup attempt exposed divisions inside the armed forces and the presidential security apparatus. The response will determine whether the military remains subordinate to the presidency."
 MAU_secure_the_constitution: "Secure the Constitutional Order"
 MAU_secure_the_constitution_desc: "The 1991 constitutional settlement created a multiparty framework. We must decide whether it will become a meaningful constraint on executive power or remain a formal document."
 MAU_reopen_political_space: "Reopen Political Space"
 MAU_reopen_political_space_desc: "Allowing opposition parties to organise and campaign can reduce the appeal of extra-parliamentary resistance. It also makes the governing party more accountable."
 MAU_reconcile_with_the_opposition: "Reconcile with the Opposition"
 MAU_reconcile_with_the_opposition_desc: "Dialogue with the Rally of Democratic Forces and other opposition parties can broaden the political system. A wider political settlement may make reform more durable."
 MAU_transition_council: "The Military Council for Justice and Democracy"
 MAU_transition_council_desc: "The 3 August 2005 coup ended Taya's rule. The new military council faces a choice between a controlled transition and indefinite military guardianship."
 MAU_prepare_the_2006_transition: "Prepare the 2006 Transition"
 MAU_prepare_the_2006_transition_desc: "The council's transition timetable leads to legislative elections in November 2006. The credibility of the process will depend on open competition and a clear return to civilian rule."
 MAU_return_to_civilian_rule: "Return to Civilian Rule"
 MAU_return_to_civilian_rule_desc: "The 2007 presidential election brought Sidi Ould Cheikh Abdallahi to office. A civilian transition gives the country an opportunity to rebuild constitutional government."
 MAU_strengthen_the_national_assembly: "Strengthen the National Assembly"
 MAU_strengthen_the_national_assembly_desc: "A stronger legislature can scrutinise ministers, debate budgets and provide a durable arena for competing political movements."
 MAU_protect_the_2007_mandate: "Protect the 2007 Mandate"
 MAU_protect_the_2007_mandate_desc: "The 2007 result created a fragile civilian mandate supported by the MITHAQ coalition. Its survival depends on political compromise and civilian control over the security services."
 MAU_prevent_the_2008_coup: "Prevent the 2008 Coup"
 MAU_prevent_the_2008_coup_desc: "The dismissal of senior officers and the president's confrontation with the military command brought the constitutional order close to collapse. Civilian authority must be exercised with a workable security settlement."
 MAU_negotiate_the_dakar_accord: "Negotiate the Dakar Accord"
 MAU_negotiate_the_dakar_accord_desc: "The Dakar process provides a route out of the 2008 crisis. A negotiated settlement can restore elections, but it will leave difficult questions about accountability and the military's political role."
 MAU_consolidate_the_aziz_order: "Consolidate the Aziz Order"
 MAU_consolidate_the_aziz_order_desc: "The 6 August 2008 coup established a military-led state council. The authorities can pursue a rapid return to elections or consolidate a more centralised presidency."
 MAU_organise_the_2009_election: "Organise the 2009 Election"
 MAU_organise_the_2009_election_desc: "The 2009 presidential vote followed a negotiated transition and a period of military rule. The election will determine whether the new order gains domestic and international recognition."
 MAU_2019_orderly_handover: "The 2019 Orderly Handover"
 MAU_2019_orderly_handover_desc: "The 2019 transfer from Mohamed Ould Abdel Aziz to Mohamed Ould Ghazouani offers a rare chance to preserve stability while separating state institutions from individual political networks."
 MAU_modernise_el_insaf: "Modernise El Insaf"
 MAU_modernise_el_insaf_desc: "The Union for the Republic was renamed El Insaf in 2022. Modernisation can renew the governing party, but credible competition requires room for other political forces."
 MAU_strengthen_civilian_oversight: "Strengthen Civilian Oversight"
 MAU_strengthen_civilian_oversight_desc: "Professional armed forces are most effective when their command structures are accountable to constitutional institutions and elected authorities."
 MAU_rebuild_snim: "Rebuild SNIM"
 MAU_rebuild_snim_desc: "The National Industrial and Mining Company is central to Mauritania's export economy. Better maintenance, logistics and investment can raise output without making the country wholly dependent on raw ore."
 MAU_expand_the_zouerate_railway: "Expand the Zouérate Railway"
 MAU_expand_the_zouerate_railway_desc: "The mining railway links inland extraction to the Atlantic coast. Improving its reliability will support exports and the wider industrial economy."
 MAU_modernise_nouadhibou_port: "Modernise Nouadhibou Port"
 MAU_modernise_nouadhibou_port_desc: "A stronger port can support mining exports, fishing fleets and maritime services. This project ties the mining and fisheries branches together."
 MAU_process_iron_at_home: "Process More Iron at Home"
 MAU_process_iron_at_home_desc: "Moving beyond raw ore exports can retain more value domestically. This requires reliable power, skills and investment."
 MAU_regulate_the_fisheries: "Regulate the Fisheries"
 MAU_regulate_the_fisheries_desc: "Mauritania's Atlantic fishing grounds are a major source of exports and employment. Monitoring and sustainable licences can protect the resource base."
 MAU_build_fish_processing_capacity: "Build Fish Processing Capacity"
 MAU_build_fish_processing_capacity_desc: "Cold storage, processing and reliable transport can increase the value captured by Mauritanian businesses."
 MAU_learn_from_chinguetti: "Learn from Chinguetti"
 MAU_learn_from_chinguetti_desc: "The Chinguetti oil project demonstrated both the promise and uncertainty of offshore hydrocarbons. Future contracts must account for volatile production and price expectations."
 MAU_prepare_offshore_gas: "Prepare for Offshore Gas"
 MAU_prepare_offshore_gas_desc: "The Greater Tortue Ahmeyim project offers a major opportunity shared with Senegal. Mauritania needs regulatory capacity, trained workers and a clear domestic-energy policy."
 MAU_harness_gta_gas: "Harness Greater Tortue Gas"
 MAU_harness_gta_gas_desc: "First gas from the Greater Tortue Ahmeyim system arrived at the end of 2024, with LNG exports beginning in 2025. The project can strengthen public finances if revenue is managed transparently."
 MAU_create_a_national_revenue_framework: "Create a National Revenue Framework"
 MAU_create_a_national_revenue_framework_desc: "A clear framework for resource revenue can reduce waste, stabilise public investment and make the benefits of gas and mining more visible to citizens."
 MAU_develop_the_senegal_river_basin: "Develop the Senegal River Basin"
 MAU_develop_the_senegal_river_basin_desc: "The Senegal River basin is essential to agriculture, irrigation and regional cooperation. Development must be planned with communities and neighbouring Senegal."
 MAU_expand_gorgol_irrigation: "Expand Gorgol Irrigation"
 MAU_expand_gorgol_irrigation_desc: "Irrigation investment can improve food security and reduce the exposure of rural livelihoods to drought."
 MAU_electrify_the_interior: "Electrify the Interior"
 MAU_electrify_the_interior_desc: "Reliable electricity outside the coastal corridor is a prerequisite for industry, education and health services."
 MAU_develop_solar_and_wind: "Develop Solar and Wind"
 MAU_develop_solar_and_wind_desc: "Mauritania's large desert and Atlantic resources make solar and wind worth developing alongside conventional energy."
 MAU_connect_rural_communities: "Connect Rural Communities"
 MAU_connect_rural_communities_desc: "Roads and local infrastructure link remote settlements to markets, schools and public services."
 MAU_professionalise_the_armed_forces: "Professionalise the Armed Forces"
 MAU_professionalise_the_armed_forces_desc: "The army's central tasks are territorial defence, border security and protection of national sovereignty. Training and professional standards should take priority over political intervention."
 MAU_train_desert_mobile_units: "Train Desert Mobile Units"
 MAU_train_desert_mobile_units_desc: "Mauritania's vast desert territory rewards mobility, logistics and reliable communications more than heavy formations."
 MAU_secure_the_eastern_frontier: "Secure the Eastern Frontier"
 MAU_secure_the_eastern_frontier_desc: "Instability across the Sahel creates risks from armed groups, smuggling and displacement. Border security must work with local communities and neighbouring states."
 MAU_coordinate_intelligence: "Coordinate Intelligence Services"
 MAU_coordinate_intelligence_desc: "Better intelligence sharing can improve early warning and border response while maintaining legal oversight."
 MAU_protect_the_atlantic_coast: "Protect the Atlantic Coast"
 MAU_protect_the_atlantic_coast_desc: "The coastline contains valuable fishing grounds, ports and offshore energy infrastructure. A capable coast guard protects both sovereignty and commerce."
 MAU_join_sahelian_security_operations: "Join Sahelian Security Operations"
 MAU_join_sahelian_security_operations_desc: "Regional security depends on cooperation with neighbouring states. Mauritania can contribute border expertise while avoiding costly commitments beyond its capacity."
 MAU_balanced_foreign_policy: "A Balanced Foreign Policy"
 MAU_balanced_foreign_policy_desc: "Mauritania sits between the Maghreb, the Atlantic and the Sahel. A balanced policy can widen investment and security partnerships without becoming dependent on one external power."
 MAU_rebuild_ties_with_algeria: "Rebuild Ties with Algeria"
 MAU_rebuild_ties_with_algeria_desc: "Algeria is a vital neighbour in the Maghreb and Sahel. Practical cooperation can improve trade, infrastructure and frontier security."
 MAU_manage_relations_with_morocco: "Manage Relations with Morocco"
 MAU_manage_relations_with_morocco_desc: "Relations with Morocco require pragmatism and regular diplomatic contact. Economic cooperation can proceed without importing regional rivalries."
 MAU_preserve_french_training_links: "Preserve French Training Links"
 MAU_preserve_french_training_links_desc: "France remains an important historical partner in training and institutional cooperation. Mauritania can retain practical links while diversifying its partnerships."
 MAU_expand_chinese_infrastructure_investment: "Expand Chinese Infrastructure Investment"
 MAU_expand_chinese_infrastructure_investment_desc: "Chinese investment can help finance large infrastructure projects. Contracts should be assessed for their long-term fiscal and strategic consequences."
 MAU_strengthen_arab_african_diplomacy: "Strengthen Arab-African Diplomacy"
 MAU_strengthen_arab_african_diplomacy_desc: "Mauritania's membership and relationships across African and Arab institutions offer diplomatic reach beyond its economic size."
 MAU_build_national_cohesion: "Build National Cohesion"
 MAU_build_national_cohesion_desc: "National cohesion requires equal citizenship, public services and confidence in the law across Mauritania's communities."
 MAU_enforce_the_anti_slavery_law: "Enforce the Anti-Slavery Law"
 MAU_enforce_the_anti_slavery_law_desc: "Mauritania criminalised slavery in 2007. Implementation requires enforcement, accessible justice and protection for people seeking redress."
 MAU_specialised_anti_slavery_courts: "Specialised Anti-Slavery Courts"
 MAU_specialised_anti_slavery_courts_desc: "Specialised courts established in 2015 can strengthen enforcement when they have resources, independence and access outside the capital."
 MAU_extend_rural_schooling: "Extend Rural Schooling"
 MAU_extend_rural_schooling_desc: "Education investment can improve literacy, technical skills and the long-term productivity of the workforce."
 MAU_expand_public_healthcare: "Expand Public Healthcare"
 MAU_expand_public_healthcare_desc: "Rural clinics and trained health workers improve resilience across a country with widely dispersed settlements."
 MAU_strengthen_local_government: "Strengthen Local Government"
 MAU_strengthen_local_government_desc: "Local administrations need capacity to deliver services, oversee projects and respond to the priorities of regional communities."
 MAU.1.t: "Mauritania at the Start of a New Century"
 MAU.1.d: "Mauritania enters the new millennium under President Maaouya Ould Sid'Ahmed Taya. The state is stable on the surface, but political competition, military loyalties and uneven development will shape the years ahead."
 MAU.1.a: "Maintain the established course"
 MAU.1.b: "Open a path for gradual reform"
 MAU.10.t: "The 2001 Parliamentary Elections"
 MAU.10.d: "The 19 October 2001 election was the first parliamentary contest in a decade in which the opposition did not boycott. The PRDS won 64 of 81 National Assembly seats. Action for Change won four, while the UDP, RFD, UFP and RDU won three each and the Popular Front won one."
 MAU.10.a: "Record the PRDS victory"
 MAU.10.b: "Seek a broader parliamentary understanding"
 MAU.20.t: "The June 2003 Coup Attempt"
 MAU.20.d: "A failed coup attempt in June 2003 exposed divisions within the armed forces. The government must decide how to respond to the plotters and the grievances that made the attempt possible."
 MAU.20.a: "Crush the mutiny and restore order"
 MAU.20.b: "Negotiate with military dissenters"
 MAU.20.c: "The military takes power"
 MAU.21.t: "The 2003 Presidential Election"
 MAU.21.d: "The presidential election of 7 November 2003 returned Taya to office. The vote takes place after the coup attempt and amid questions about the strength of the political opposition."
 MAU.21.a: "Maintain the PRDS mandate"
 MAU.21.b: "Acknowledge the opposition's challenge"
 MAU.30.t: "The Coup of 3 August 2005"
 MAU.30.d: "While President Taya is abroad, military officers led by Ely Ould Mohamed Vall seize power. The Military Council for Justice and Democracy promises a transition to civilian rule within two years."
 MAU.30.a: "Support the Military Council for Justice and Democracy"
 MAU.30.b: "Remain loyal to the old government"
 MAU.30.c: "Seek a negotiated civilian settlement"
 MAU.40.t: "A Timetable for Political Transition"
 MAU.40.d: "The transitional authorities prepare legislative elections and a presidential vote. The central question is whether the military will allow the process to produce a government independent of the council."
 MAU.40.a: "Commit to the transition timetable"
 MAU.40.b: "Delay the return to civilian rule"
 MAU.41.t: "The 2007 Presidential Election"
 MAU.41.d: "Sidi Ould Cheikh Abdallahi wins the second round of the presidential election on 25 March 2007. He is an independent candidate supported by the MITHAQ coalition and takes office on 19 April."
 MAU.41.a: "Transfer power to the civilian president"
 MAU.41.b: "Retain military guardianship"
 MAU.50.t: "The Coup of 6 August 2008"
 MAU.50.d: "General Mohamed Ould Abdel Aziz leads a coup after President Abdallahi dismisses senior military officers. The coup ends the country's short period of uninterrupted civilian rule."
 MAU.50.a: "The High State Council assumes power"
 MAU.50.b: "Defend the constitutional government"
 MAU.51.t: "The 2009 Presidential Election"
 MAU.51.d: "After the Dakar process, elections are held on 18 July 2009. Mohamed Ould Abdel Aziz resigns from the military leadership and wins the presidency."
 MAU.51.a: "Elect Mohamed Ould Abdel Aziz"
 MAU.51.b: "Form a national unity government"
 MAU.60.t: "Enforcing the 2007 Anti-Slavery Law"
 MAU.60.d: "Mauritania's 2007 law criminalises slavery, but legislation alone cannot end entrenched practices. Enforcement, legal support and access to justice remain difficult."
 MAU.60.a: "Fund enforcement and legal assistance"
 MAU.60.b: "Proceed gradually"
 MAU.70.t: "The 2019 Transfer of Power"
 MAU.70.d: "Mohamed Ould Ghazouani succeeds Mohamed Ould Abdel Aziz after the June 2019 election. A peaceful transfer can strengthen confidence in the institutions, but the relationship between the presidency and the ruling party remains important."
 MAU.70.a: "Support the orderly transfer"
 MAU.70.b: "Allow the transition to remain contested"
 MAU.71.t: "The 2024 Presidential Election"
 MAU.71.d: "Ghazouani wins re-election in June 2024. The government must decide how to use its renewed mandate and respond to the opposition's concerns."
 MAU.71.a: "Consolidate the second term"
 MAU.71.b: "Offer a wider political dialogue"
 MAU.80.t: "The Greater Tortue Ahmeyim Gas Project"
 MAU.80.d: "The Greater Tortue Ahmeyim project, shared with Senegal, reaches first gas production at the end of 2024. LNG exports begin in 2025, creating new opportunities and new demands for transparent revenue management."
 MAU.80.a: "Prioritise public investment"
 MAU.80.b: "Create a transparent revenue framework"
 MAU.90.t: "A National Election"
 MAU.90.d: "Mauritania's political system enters another electoral cycle. The result will depend on the relative strength of the registered parties and the coalitions they can assemble."
 MAU.90.a: "Accept the election result and form a government"
 MAU.90.b: "Contest the result and seek dialogue"
 MAU.101.t: "The Atlantic Fisheries"
 MAU.101.d: "The fisheries sector is a major source of exports and jobs. Better management could improve the value of the catch while protecting stocks and coastal livelihoods."
 MAU.101.a: "Invest in processing and exports"
 MAU.101.b: "Prioritise sustainable fisheries management"
 MAU.102.t: "The Chinguetti Oil Experience"
 MAU.102.d: "The Chinguetti offshore oil project did not produce the lasting boom once anticipated. Mauritania must avoid basing its budget on uncertain production forecasts."
 MAU.102.a: "Improve contract and revenue planning"
 MAU.102.b: "Reduce exposure to oil volatility"
 MAU.103.t: "Security Across the Sahel"
 MAU.103.d: "Regional insecurity creates pressure along Mauritania's eastern borders. Cooperation can improve intelligence and border management, but it must be matched by national capacity."
 MAU.103.a: "Expand regional security cooperation"
 MAU.103.b: "Prioritise local border resilience"
 MAU.104.t: "Specialised Courts and Access to Justice"
 MAU.104.d: "Specialised courts for slavery-related offences were established in 2015. Their effectiveness depends on resources, judicial independence and access for victims."
 MAU.104.a: "Strengthen the courts"
 MAU.104.b: "Prioritise gradual institutional development"
 MAU_historical_campaign_begins_tt: "The historical Mauritanian campaign begins."
 MAU_reformist_mandate_tt: "Gradual political reform will remain an option."
 MAU_national_development: "National Development"
 MAU_internal_affairs: "Internal Affairs"
 MAU_sahel_security: "Sahel Security"
 MAU_prds_patronage: "PRDS Patronage Networks"
 MAU_prds_patronage_desc: "The governing party relies on personal networks and patronage to maintain political control."
 MAU_iron_ore_dependency: "Iron Ore Dependence"
 MAU_iron_ore_dependency_desc: "Iron ore exports provide essential revenue, but the economy remains exposed to commodity prices and transport bottlenecks."
 MAU_transitional_council: "Military Transition Council"
 MAU_transitional_council_desc: "The Military Council for Justice and Democracy directs the transition following the 2005 coup."
 MAU_mithaq_coalition: "MITHAQ Coalition"
 MAU_mithaq_coalition_desc: "A coalition of parties and independents supports the civilian presidency elected in 2007."
 MAU_parliamentary_reform: "Parliamentary Reform"
 MAU_parliamentary_reform_desc: "The legislature has greater capacity to scrutinise government and represent political competition."
 MAU_civilian_control: "Civilian Control of the Armed Forces"
 MAU_civilian_control_desc: "Military command is increasingly accountable to elected civilian authorities."
 MAU_presidential_centralisation: "Presidential Centralisation"
 MAU_presidential_centralisation_desc: "Executive authority is concentrated in the presidency and its governing networks."
 MAU_orderly_handover: "Orderly Transfer of Power"
 MAU_orderly_handover_desc: "The transfer of power in 2019 reinforces the continuity of state institutions."
 MAU_snim_reform: "SNIM Modernisation"
 MAU_snim_reform_desc: "Improved management and maintenance support the national mining company and its export infrastructure."
 MAU_value_added_industry: "Value-Added Industry"
 MAU_value_added_industry_desc: "Domestic processing retains more value from mineral exports and encourages industrial skills."
 MAU_fisheries_exports: "Fisheries Export Economy"
 MAU_fisheries_exports_desc: "The fishing sector contributes exports and employment, supported by better processing and sustainable management."
 MAU_hydrocarbon_lessons: "Lessons from Chinguetti"
 MAU_hydrocarbon_lessons_desc: "The early offshore oil experience encourages more cautious contracts and revenue planning."
 MAU_gas_development: "Offshore Gas Development"
 MAU_gas_development_desc: "Regulatory, technical and commercial preparation supports the development of shared offshore gas resources."
 MAU_gta_gas_revenue: "Greater Tortue Gas Revenue"
 MAU_gta_gas_revenue_desc: "LNG exports create a new revenue stream and an opportunity to improve energy access and public investment."
 MAU_resource_revenue_framework: "Resource Revenue Framework"
 MAU_resource_revenue_framework_desc: "Transparent public accounting and long-term planning help manage volatile mining and hydrocarbon income."
 MAU_river_agriculture: "Senegal River Agriculture"
 MAU_river_agriculture_desc: "Irrigation and agricultural development along the Senegal River improve food security and rural livelihoods."
 MAU_national_electrification: "National Electrification"
 MAU_national_electrification_desc: "Expanded electricity infrastructure supports industry, services and rural development."
 MAU_solar_programme: "Solar and Wind Programme"
 MAU_solar_programme_desc: "Renewable energy development takes advantage of Mauritania's solar and wind potential."
 MAU_professional_armed_forces: "Professional Armed Forces"
 MAU_professional_armed_forces_desc: "Improved training, planning and command standards strengthen territorial defence."
 MAU_desert_mobility: "Desert Mobility"
 MAU_desert_mobility_desc: "Specialised mobility and logistics improve the army's ability to operate across remote desert terrain."
 MAU_sahelian_border_pressure: "Sahelian Border Pressure"
 MAU_sahelian_border_pressure_desc: "Instability in neighbouring regions places a persistent strain on border security and internal stability."
 MAU_coast_guard: "Atlantic Coast Guard"
 MAU_coast_guard_desc: "Maritime patrols protect fishing grounds, ports and offshore infrastructure."
 MAU_sahel_cooperation: "Sahel Security Cooperation"
 MAU_sahel_cooperation_desc: "Regional intelligence and security cooperation improves coordination with neighbouring states."
 MAU_balanced_diplomacy: "Balanced Diplomacy"
 MAU_balanced_diplomacy_desc: "Mauritania maintains practical diplomatic and economic relations across the Maghreb, Atlantic and Sahel regions."
 MAU_external_investment: "External Infrastructure Investment"
 MAU_external_investment_desc: "Foreign capital supports infrastructure projects while increasing the importance of contract oversight."
 MAU_national_cohesion: "National Cohesion"
 MAU_national_cohesion_desc: "Public services and equal treatment under the law strengthen the bonds between Mauritania's communities."
 MAU_anti_slavery_enforcement: "Anti-Slavery Enforcement"
 MAU_anti_slavery_enforcement_desc: "Enforcement of the 2007 anti-slavery law improves access to justice and state accountability."
 MAU_specialised_courts: "Specialised Anti-Slavery Courts"
 MAU_specialised_courts_desc: "Specialised courts established in 2015 provide a dedicated route for slavery-related prosecutions."
 MAU_rural_education: "Rural Education"
 MAU_rural_education_desc: "Expanded schooling improves literacy and the supply of skilled workers."
 MAU_public_healthcare: "Public Healthcare"
 MAU_public_healthcare_desc: "Better rural clinics and health services improve national resilience."
 MAU_nouadhibou_fisheries_programme: "Nouadhibou Fisheries Programme"
 MAU_nouadhibou_fisheries_programme_desc: "Strengthen the fisheries supply chain and improve the value retained by coastal communities."
 MAU_snim_efficiency_review: "SNIM Efficiency Review"
 MAU_snim_efficiency_review_desc: "Improve productivity and export reliability at SNIM."
 MAU_gta_transparency_audit: "Greater Tortue Revenue Audit"
 MAU_gta_transparency_audit_desc: "Improve accountability for revenues from the Greater Tortue Ahmeyim project."
 MAU_fund_anti_slavery_enforcement: "Fund Anti-Slavery Enforcement"
 MAU_fund_anti_slavery_enforcement_desc: "Support implementation of the anti-slavery law."
 MAU_strengthen_specialised_courts: "Strengthen Specialised Courts"
 MAU_strengthen_specialised_courts_desc: "Improve the capacity of specialised courts to hear slavery-related cases."
 MAU_hold_local_consultations: "Hold Local Consultations"
 MAU_hold_local_consultations_desc: "Build local confidence in government and identify practical service improvements."
 MAU_border_intelligence_coordination: "Border Intelligence Coordination"
 MAU_border_intelligence_coordination_desc: "Support early warning and cross-border security coordination."
 MAU_mobile_desert_patrols: "Mobile Desert Patrols"
 MAU_mobile_desert_patrols_desc: "Increase the army's readiness for mobile operations across desert terrain."
 MAU_action_for_change_seats_retained_tt: "The party is banned, but its sitting legislators retain their seats until the next parliamentary renewal."
 MAU_historical_campaign_begins_tt: "The historical Mauritanian campaign begins."
 MAU_reformist_mandate_tt: "Gradual political reform will remain an option."
 MAU_assembly_seats_tt: "The 2001 National Assembly seat distribution is recorded for the historical campaign."
 MAU.12.t: "The Ban on Action for Change"
 MAU.12.d: "In January 2002 the authorities ban Action for Change. The party's sitting members are allowed to retain their parliamentary seats, but the decision narrows the space for opposition organisation."
 MAU.12.a: "Ban the party but leave its MPs in place"
 MAU.12.b: "Avoid a ban and preserve the opposition's legal status"
 MAU.104.t: "Specialised Courts and Access to Justice"
 MAU.104.d: "Specialised courts for slavery-related offences were established in 2015. Their effectiveness depends on resources, judicial independence and access for victims."
 MAU.104.a: "Strengthen the courts"
 MAU.104.b: "Prioritise gradual institutional development"
 MAU_support_multiparty_elections: "Support Multiparty Elections"
 MAU_support_multiparty_elections_desc: "A competitive electoral system can give opposition parties a stake in constitutional politics and reduce the incentive to challenge the state outside parliament."
 MAU_restore_action_for_change: "Restore Action for Change"
 MAU_restore_action_for_change_desc: "The ban on Action for Change removed an important opposition voice from the legal party system. Reinstatement would widen competition, though it may strain the governing establishment."
 MAU_protect_independent_press: "Protect an Independent Press"
 MAU_protect_independent_press_desc: "Independent reporting can make public institutions more accountable. The government must accept scrutiny if political reform is to be credible."
 MAU_strengthen_judicial_independence: "Strengthen Judicial Independence"
 MAU_strengthen_judicial_independence_desc: "Courts that can act without political interference help enforce the law and protect the credibility of public institutions."
 MAU_institutionalise_civilian_rule: "Institutionalise Civilian Rule"
 MAU_institutionalise_civilian_rule_desc: "Civilian government must become more than a temporary arrangement. Parliamentary oversight and predictable constitutional procedures can reduce the risk of future military intervention."
 MAU_limit_presidential_interference: "Limit Presidential Interference"
 MAU_limit_presidential_interference_desc: "A clearer division between the presidency, parliament and judiciary can improve institutional stability and public trust."
 MAU_expand_mithaq_coalition: "Expand the MITHAQ Coalition"
 MAU_expand_mithaq_coalition_desc: "The MITHAQ alliance brought parties and independents together behind Sidi Ould Cheikh Abdallahi. Wider cooperation can strengthen the civilian mandate."
 MAU_dialogue_with_islamist_movement: "Dialogue with the Islamist Movement"
 MAU_dialogue_with_islamist_movement_desc: "Islamist currents are part of Mauritania's social and political landscape. Dialogue can bring moderate movements into peaceful parliamentary competition."
 MAU_legalise_tawassoul_participation: "Allow Tewassoul to Compete"
 MAU_legalise_tawassoul_participation_desc: "The moderate Islamist Tewassoul party emerges in the later multiparty period. Its participation can widen electoral representation and sharpen parliamentary debate."
 MAU_parliamentary_social_programme: "A Parliamentary Social Programme"
 MAU_parliamentary_social_programme_desc: "Social policy focused on health, education and rural services can help translate political competition into tangible improvements."
 MAU_build_resource_skills: "Build Resource-Sector Skills"
 MAU_build_resource_skills_desc: "Mining and port infrastructure need trained engineers, technicians and administrators. Investment in skills helps Mauritania retain more value from its mineral sector."
 MAU_domestic_gas_supply: "Use Gas for Domestic Development"
 MAU_domestic_gas_supply_desc: "LNG exports can generate revenue, but domestic energy access also matters. A balanced gas strategy should support power generation and industrial development."
 MAU_gas_transparency_and_stabilisation: "Stabilise and Audit Gas Revenue"
 MAU_gas_transparency_and_stabilisation_desc: "A public revenue framework can reduce exposure to commodity cycles and ensure offshore gas income supports long-term development."
 MAU_develop_sahelian_security_centre: "Develop a Sahelian Security Centre"
 MAU_develop_sahelian_security_centre_desc: "Intelligence coordination and training can improve early warning and border security without requiring Mauritania to overextend its armed forces."
 MAU_empower_regional_councils: "Empower Regional Councils"
 MAU_empower_regional_councils_desc: "Local authorities are often closest to the needs of remote communities. Better resources and accountability can improve service delivery."
 MAU_expand_rural_livelihoods: "Expand Rural Livelihoods"
 MAU_expand_rural_livelihoods_desc: "Agricultural services, irrigation and transport investment can make rural communities more resilient to drought and market disruption."
 MAU_expand_mining_training: "Expand Mining Training"
 MAU_expand_mining_training_desc: "Technical training for mining, rail and port workforces supports SNIM and the wider industrial supply chain."
 MAU_promote_sustainable_fisheries: "Promote Sustainable Fisheries"
 MAU_promote_sustainable_fisheries_desc: "Long-term fisheries revenue depends on careful licensing, monitoring and processing capacity rather than short-term extraction alone."
 MAU_create_a_sahelian_trade_corridor: "Create a Sahelian Trade Corridor"
 MAU_create_a_sahelian_trade_corridor_desc: "A network of road, port and customs improvements can connect Mauritania's Atlantic economy with inland Sahelian markets."
 MAU_el_insaf_institutional_reform: "Reform El Insaf's Institutions"
 MAU_el_insaf_institutional_reform_desc: "The rebranding of the ruling party as El Insaf offers an opportunity to modernise its organisation and clarify its role in government."
 MAU_aziz_infrastructure_drive: "Aziz's Infrastructure Drive"
 MAU_aziz_infrastructure_drive_desc: "The government can use public investment to strengthen ports, industrial corridors and regional transport, while managing the fiscal risks of large projects."
